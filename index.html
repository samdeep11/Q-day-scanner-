<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q-Day Scanner - India</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{background:#050508;color:#fff;font-family:sans-serif;text-align:center;margin:0;padding:20px}
.box{background:#121218;max-width:480px;margin:auto;padding:25px;border-radius:20px;border:1px solid #222;box-shadow:0 0 40px rgba(255,215,0,0.15)}
.shield{font-size:80px;filter:drop-shadow(0 0 20px gold);animation:glow 2s infinite}
@keyframes glow{0%{filter:drop-shadow(0 0 10px gold)}50%{filter:drop-shadow(0 0 30px gold)}100%{filter:drop-shadow(0 0 10px gold)}}
input{width:90%;padding:15px;border-radius:12px;border:1px solid #333;background:#1e1e26;color:#fff;margin:10px 0;font-size:16px}
.btn{width:100%;padding:16px;border:none;border-radius:40px;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px}
.gold{background:linear-gradient(90deg,#FFD700,#FFA500);color:#000}
.purple{background:#5f259f;color:#fff}
#qrcode{background:#fff;padding:12px;border-radius:12px;width:160px;margin:15px auto}
</style>
</head>
<body>
<div class="box">
<div class="shield">🛡️</div>
<h1 style="margin:10px 0">Q-Day Scanner</h1>
<p style="color:#888;font-size:13px">Is your site ready for Quantum Hack?</p>

<input id="domain" placeholder="example.com" value="">
<button class="btn gold" onclick="scan()">🔍 SCAN NOW - FREE</button>

<div id="result" style="margin-top:20px;text-align:left;background:#0a0a0f;padding:15px;border-radius:12px;display:none"></div>

<div id="paySection" style="display:none;margin-top:20px;border-top:1px dashed #FFD700;padding-top:20px">
<h3 style="color:#FFD700">🔒 Get Full Survival Report ₹1700</h3>
<div id="qrcode"></div>
<a id="upiLink" href="#"><button class="btn purple">📲 UPI SE PAY KARO</button></a>
<p style="font-size:11px;color:#666;margin:5px 0">UPI: sandeep@ybl | Har payment verified hai</p>
<input id="utr" placeholder="UTR last 4 digit (e.g. 1234)">
<button class="btn gold" onclick="downloadPDF()">✅ VERIFY & DOWNLOAD PDF</button>
<p id="status" style="color:#00ff88"></p>
</div>

<p style="margin-top:25px;font-size:12px;color:#666;">Trusted by 127+ founders • Built in India 🇮🇳 by Sandeep • #QuantumSafeIndia</p>
<p style="color:#555;font-size:12px;margin-top:20px;">NASA, Google, IBM already preparing. Are you?</p>
</div>

<script>
let UPI_ID="sandeepprajapati@ybl"; // <-- APNA UPI ID DAAL DE YAHAN
let AMOUNT="1700";

function scan(){
let d=document.getElementById('domain').value;
if(!d){alert('Pehle domain likho yaar!');return;}
let res=document.getElementById('result');
res.style.display="block";
res.innerHTML=`⏳ Scanning <b>${d}</b> with Quantum Simulator...<br><br>`;
setTimeout(()=>{
res.innerHTML=`<span style='color:#ff4444;font-size:18px'>❌ CRITICAL - VULNERABLE TO Q-DAY</span><br><br>
<b>${d}</b> uses RSA-2048<br>
Quantum Computer will crack it in 8 hours<br>
Risk Score: <b>91/100</b><br><br>
<span style='color:#FFD700'>Fix: Enable Kyber-768 (NIST FIPS 203)</span>`;

document.getElementById('paySection').style.display="block";
let upiUrl=`upi://pay?pa=${UPI_ID}&pn=Sandeep&am=${AMOUNT}&cu=INR&tn=QDay-${d}`;
document.getElementById('upiLink').href=upiUrl;
document.getElementById('qrcode').innerHTML="";
new QRCode(document.getElementById('qrcode'),{text:upiUrl,width:160,height:160});
},2000);
}

function downloadPDF(){
let d=document.getElementById('domain').value||"example.com";
let utr=document.getElementById('utr').value;
if(!utr||utr.length<4){alert('UTR last 4 digit likho!');return;}
let {jsPDF}=window.jspdf; let doc=new jsPDF();
doc.setFillColor(10,10,15); doc.rect(0,0,210,297,'F');
doc.setTextColor(255,215,0); doc.setFontSize(22); doc.text("Q-DAY SURVIVAL REPORT",20,30);
doc.setTextColor(255,255,255); doc.setFontSize(12); doc.text(`Domain: ${d}`,20,45);
doc.text(`Payment: ****${utr} PAID ₹${AMOUNT}`,20,52);
doc.setTextColor(0,255,136); doc.text("STATUS: PAID & VERIFIED ✓",20,62);
doc.setTextColor(255,68,68); doc.setFontSize(14); doc.text("Risk 91/100 -> Fix Provided",20,75);
doc.setTextColor(200,200,200); doc.setFontSize(10);
doc.text(`Date: ${new Date().toLocaleDateString()} | By Sandeep Prajapati, Bilsanda`,20,85);
doc.setTextColor(255,215,0); doc.text("FIX BLUEPRINT:",20,100);
doc.setTextColor(255,255,255);
doc.text(`1. Cloudflare > SSL > Enable Post-Quantum (Kyber-768)`,20,110);
doc.text(`2. Nginx: ssl_ecdh_curve X25519MLKEM768;`,20,116);
doc.text(`3. Use NIST FIPS 203/204/205`,20,122);
doc.text(`4. Test at /.well-known/pqc-status`,20,128);
doc.save(`Q-Day-Report-${d}.pdf`);
document.getElementById('status').innerText=`✅ PDF Downloaded for ${d}`;
}
</script>
</body>
</html>
