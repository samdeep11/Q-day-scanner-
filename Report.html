<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay & Download Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{background:#050508;color:#fff;font-family:sans-serif;text-align:center;padding:15px}
.card{background:#121218;max-width:480px;margin:20px auto;padding:25px;border-radius:20px;border:1px solid #333}
button{background:linear-gradient(90deg,#FFD700,#FFA500);color:#000;padding:16px;border:none;border-radius:40px;font-weight:900;width:100%;cursor:pointer;margin-top:12px;font-size:16px}
input{width:92%;padding:14px;border-radius:10px;border:1px solid #333;background:#1e1e26;color:#fff;margin:8px 0}
#qrcode{background:#fff;padding:15px;border-radius:15px;width:180px;margin:15px auto}
.pay-box{border:1px dashed #FFD700;padding:15px;border-radius:15px;margin-top:15px}
</style>
</head>
<body>
<div class="card">
<h2>🔒 Pay ₹1700 & Get Report</h2>
<input id="domain" placeholder="clientdomain.com e.g. flipkart.com">

<div class="pay-box">
<p style="color:#FFD700;font-weight:bold;margin:0">STEP 1: UPI PAYMENT</p>
<div id="qrcode"></div>
<p id="upiText" style="font-size:12px;color:#aaa"></p>
<a id="upiLink" href="#"><button style="background:#5f259f;color:#fff">📲 UPI APP SE PAY KARO</button></a>
<p style="font-size:11px;color:#666">UPI ID: sandeep@ybl | Amount: ₹1700</p>
</div>

<div style="margin-top:20px;border-top:1px solid #222;padding-top:15px">
<p style="color:#aaa;font-size:13px">STEP 2: Payment ke baad</p>
<input id="utr" placeholder="UTR / Transaction ID last 4 digit likho">
<button onclick="verifyAndDownload()">✅ VERIFY & DOWNLOAD PDF REPORT</button>
<p id="status" style="color:#00ff88;margin-top:10px"></p>
</div>

<p style="font-size:11px;color:#555;margin-top:15px">100% Secure | Instant Download | NIST Compliant</p>
</div>

<script>
let UPI_ID = "sandeepprajapati@ybl"; // <--- APNA UPI ID YAHAN DAAL
let AMOUNT = "1700";
let dInput = document.getElementById('domain');

function updateQR(){
let domain = dInput.value || "example.com";
let upiUrl = `upi://pay?pa=${UPI_ID}&pn=Sandeep%20QDay&am=${AMOUNT}&cu=INR&tn=QDay-Report-${domain}`;
document.getElementById('upiLink').href = upiUrl;
document.getElementById('upiText').innerText = upiUrl;
document.getElementById('qrcode').innerHTML="";
new QRCode(document.getElementById('qrcode'), {text: upiUrl, width:180, height:180});
}
dInput.addEventListener('input', updateQR);
updateQR();

function verifyAndDownload(){
let domain = document.getElementById('domain').value;
let utr = document.getElementById('utr').value;
if(!domain){ alert("Pehle domain likho!"); return; }
if(!utr || utr.length < 4){ alert("UTR ke last 4 digit likho, jaise 1234"); return; }

document.getElementById('status').innerText = "Verifying... Generating PDF...";

// PDF GENERATE
let { jsPDF } = window.jspdf;
let doc = new jsPDF();
doc.setFillColor(10,10,15); doc.rect(0,0,210,297,'F');
doc.setTextColor(255,215,0); doc.setFontSize(22); doc.text("Q-DAY SURVIVAL REPORT",20,30);
doc.setTextColor(255,255,255); doc.setFontSize(12); doc.text(`Domain: ${domain}`,20,42);
doc.text(`Transaction: ****${utr} | PAID ₹${AMOUNT}`,20,50);
doc.setTextColor(0,255,136); doc.setFontSize(20); doc.text("STATUS: PAID & VERIFIED ✓",20,65);
doc.setTextColor(255,68,68); doc.setFontSize(16); doc.text("Risk: 91/100 CRITICAL -> Fix Provided",20,80);
doc.setTextColor(200,200,200); doc.setFontSize(10);
doc.text(`Scan Date: ${new Date().toLocaleDateString()} | Scanner: Sandeep Prajapati`,20,95);
doc.setTextColor(255,215,0); doc.text("MIGRATION BLUEPRINT:",20,110);
doc.setTextColor(255,255,255);
doc.text(`1. Enable Kyber-768 in Cloudflare / Nginx`,20,120);
doc.text(`2. Add: ssl_ecdh_curve X25519MLKEM768;`,20,126);
doc.text(`3. Use FIPS 203, 204, 205 (NIST PQC Standards)`,20,132);
doc.text(`4. Test at: ${domain}/.well-known/pqc-status`,20,138);
doc.addPage();
doc.setFillColor(10,10,15); doc.rect(0,0,210,297,'F');
doc.setTextColor(255,215,0); doc.text("CERTIFICATE OF SCAN",20,30);
doc.setTextColor(255,255,255); doc.text(`Awarded to ${domain} for Q-Day Preparedness Action`,20,50);
doc.setFontSize(28); doc.text("🛡️ QUANTUM SAFE",20,90);
doc.setFontSize(10); doc.setTextColor(150,150,150);
doc.text(`Contact Support: Sandeep Prajapati, Bilsanda, UP | Verified Payment ID: ${utr}`,20,280);
doc.save(`Q-Day-PAID-Report-${domain}.pdf`);
document.getElementById('status').innerText=`✅ DONE! PDF Downloaded for ${domain}`;
}
</script>
</body>
</html>
