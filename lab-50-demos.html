<script>
// Modal ke andar TABS ka function
function openWithAllTabs(lab) {
  cur=lab;
  document.getElementById('mTitle').innerText=lab[0];
  document.getElementById('mResult').innerHTML=`
  <div class="flex gap-1 mt-2 border-b border-indigo-800 pb-2">
    <button onclick="showTab('upi')" id="t-upi" class="px-2 py-1 rounded text-[10px] bg-green-600 text-white">UPI Check</button>
    <button onclick="showTab('qr')" id="t-qr" class="px-2 py-1 rounded text-[10px] bg-[#1a214f] text-indigo-300">QR Check</button>
    <button onclick="showTab('cert')" id="t-cert" class="px-2 py-1 rounded text-[10px] bg-[#1a214f] text-indigo-300">Cert Chain</button>
    <button onclick="showTab('quantum')" id="t-quantum" class="px-2 py-1 rounded text-[10px] bg-yellow-600/20 text-yellow-300">Quantum Safe</button>
  </div>
  <div id="tab-upi" class="tab mt-2 text-xs">UPI ID: <input id="in-upi" placeholder="demo@upi" class="w-full p-1.5 mt-1 rounded bg-black border border-indigo-700"><button onclick="document.getElementById('out').innerHTML='⚠️ Fake Collect Detected | Block + 1930'" class="mt-2 w-full py-1.5 bg-red-600 rounded text-white">Check UPI</button></div>
  <div id="tab-qr" class="tab mt-2 text-xs hidden">QR Data: <input placeholder="Scan QR" class="w-full p-1.5 mt-1 rounded bg-black border border-indigo-700"><button onclick="document.getElementById('out').innerHTML='⚠️ QR leads to phishing site'" class="mt-2 w-full py-1.5 bg-orange-600 rounded text-white">Check QR</button></div>
  <div id="tab-cert" class="tab mt-2 text-xs hidden">Cert No: <input id="in-cert" placeholder="UP2026XXXX" class="w-full p-1.5 mt-1 rounded bg-black border border-indigo-700"><button onclick="document.getElementById('out').innerHTML='✅ On-Chain Verified | Hash: 0x'+Math.random().toString(16).slice(2,10)" class="mt-2 w-full py-1.5 bg-cyan-600 rounded text-white">Verify Chain</button></div>
  <div id="tab-quantum" class="tab mt-2 text-xs hidden"><p>RSA-2048: <span style='color:#f87171'>Vulnerable ❌</span><br>Kyber-768: <span style='color:#4ade80'>Safe ✅</span><br>Dilithium: <span style='color:#4ade80'>Verified ✅</span></p><button onclick="document.getElementById('out').innerHTML='🧬 Quantum Safe Active - Q-Day Ready'" class="mt-2 w-full py-1.5 bg-yellow-500 text-black rounded font-bold">Run Quantum Check</button></div>
  <div id="out" class="mt-3 p-2 bg-black/50 rounded text-xs border border-green-500/20"></div>
  `;
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modal').classList.add('flex');
}
function showTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.add('hidden'));
  document.getElementById('tab-'+name).classList.remove('hidden');
  document.querySelectorAll('[id^=t-]').forEach(b=>{b.className='px-2 py-1 rounded text-[10px] bg-[#1a214f] text-indigo-300';});
  document.getElementById('t-'+name).className='px-2 py-1 rounded text-[10px] bg-green-600 text-white';
}
</script>
