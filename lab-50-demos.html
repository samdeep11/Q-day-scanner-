<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>50 Demos</title>
<style>body{background:#020617;color:#fff;font-family:Arial;padding:10px}h1{text-align:center;color:gold;border:2px solid gold;padding:10px;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px} .card{background:#1e293b;padding:10px;border-radius:8px;border:1px solid #334155} button{width:100%;padding:8px;background:gold;color:#000;font-weight:bold;border:none;border-radius:5px;margin-top:5px} .res{font-size:11px;margin-top:6px;color:#4ade80;min-height:18px} @media(max-width:600px){.grid{grid-template-columns:1fr}}</style>
</head>
<body>
<h1>LAB 22 : 50 QUANTUM AI DEMOS<br><span style="font-size:14px;color:#4ade80">Mathura's Biggest Project - Q-Day Ready</span></h1>
<div id="box" class="grid"></div>
<script>
let c="";for(let i=1;i<=50;i++){c+=`<div class=card><b style=color:gold>DEMO ${i}</b><br>Quantum AI Demo ${i}<br><button onclick="run(${i})">RUN DEMO ${i}</button><div id=r${i} class=res>Click RUN...</div></div>`}document.getElementById('box').innerHTML=c;
function run(id){document.getElementById('r'+id).innerHTML=`✅ Quantum: Verified in ${(Math.random()*0.01).toFixed(4)}s<br>⛓️ Blockchain: Safe<br>🛡️ AI Risk: ${Math.floor(Math.random()*100)}% Checked<br>Hash: 00${Math.random().toString(36).substr(2,4).toUpperCase()}`}
</script>
</body>
</html>
