<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>50 Labs - FIXED</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background:#060a1f;color:white;font-family:sans-serif">

<div style="background:#080e2c;padding:12px;display:flex;justify-content:space-between;align-items:center">
<a href="index.html" style="color:#4ade80;font-weight:bold;text-decoration:none">← HOME</a>
<span style="background:#eab308;color:black;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold">50 LABS - FIXED & WORKING</span>
</div>

<div style="max-width:1100px;margin:auto;padding:20px">
<h1 style="color:#4ade80;font-size:24px;font-weight:bold">🧪 50 Labs - Click Karo, Kaam Karega ✅</h1>
<p style="color:#a5b4fc;font-size:12px;margin-top:4px">Ab har button 100% working hai. Kisi bhi lab pe click karo.</p>

<div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:20px"></div>
</div>

<div id="popup" style="position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:999">
<div style="background:#0f1740;border:1px solid #22c55e;border-radius:16px;max-width:500px;width:100%;padding:20px">
<h2 id="pTitle" style="font-weight:bold;font-size:18px;color:white"></h2>
<p id="pDesc" style="color:#a5b4fc;font-size:12px;margin-top:6px"></p>

<input id="userInput" placeholder="Enter UPI / Cert No / QR" style="margin-top:12px;width:100%;padding:10px;border-radius:8px;background:black;border:1px solid #4338ca;color:white">

<div id="resultBox" style="margin-top:12px;background:black;padding:10px;border-radius:8px;font-size:12px;border:1px solid #1e1b4b;display:none"></div>

<div style="display:flex;gap:8px;margin-top:16px">
<button onclick="doCheck()" style="flex:1;padding:10px;background:#22c55e;border-radius:20px;color:white;font-weight:bold;border:none">▶ RUN CHECK</button>
<button onclick="closePop()" style="flex:1;padding:10px;background:#1e1b4b;border-radius:20px;color:#a5b4fc;border:none">CLOSE</button>
</div>

<div style="display:flex;gap:6px;margin-top:12px">
<button onclick="tab('upi')" id="b-upi" style="padding:4px 8px;border-radius:12px;background:#22c55e;color:white;font-size:10px;border:none">UPI</button>
<button onclick="tab('qr')" id="b-qr" style="padding:4px 8px;border-radius:12px;background:#1e1b4b;color:#a5b4fc;font-size:10px;border:none">QR</button>
<button onclick="tab('cert')" id="b-cert" style="padding:4px 8px;border-radius:12px;background:#1e1b4b;color:#a5b4fc;font-size:10px;border:none">CERT</button>
<button onclick="tab('quantum')" id="b-quantum" style="padding:4px 8px;border-radius:12px;background:rgba(234,179,8,0.2);color:#facc15;font-size:10px;border:none">QUANTUM</button>
</div>

</div>
</div>

<script>
let currentType = "upi";
let currentLab = "";

const labsList = [
["UPI Collect Scam","Fake collect request","upi"],
["QR Swap Fraud","Shop QR overlay","qr"],
["Fake Loan App","Permission abuse","upi"],
["SIM Swap","OTP steal","upi"],
["UP Board Verify","UPMSP blockchain","cert"],
["CBSE Verify","CBSE chain","cert"],
["Quantum Safe Lab","Dilithium+Kyber","quantum"],
["Blockchain AI","0.001s detect","quantum"],
["AI Voice Clone","Voice fraud","quantum"],
["Deepfake Video","Video check","quantum"],
["Shor Break Demo","RSA break vs PQC","quantum"],
["Kyber KEM Demo","Key exchange","quantum"],
["Dilithium Sign","Signature verify","quantum"],
["Phishing URL","Link check","upi"],
["Crypto Double Scam","Giveaway trap","upi"],
["UPI AutoPay Scam","AutoPay misuse","upi"],
["NFC Tap Fraud","Contactless trap","upi"],
["Juice Jacking","USB charging","upi"],
["QR Phishing","QR to fake site","qr"],
["Cert Tamper Check","Hash tamper","cert"],
["DigiLocker Fake","Spoof check","cert"],
["Aadhaar Link Fraud","Aadhaar UPI","upi"],
["Whatsapp OTP","WhatsApp OTP steal","upi"],
["OLX Fraud","Fake buyer","upi"],
["Customer Care Fake","Fake helpline","upi"],
["Lottery SMS","KBC fraud","upi"],
["Job Scam","Fake offer","upi"],
["KYC Fraud","Bank KYC trap","upi"],
["Electricity Bill Scam","Bill trap","upi"],
["Fastag Fraud","Recharge scam","upi"],
["UPI Lite Abuse","Lite misuse","upi"],
["SoundBox Hack","Soundbox spoof","upi"],
["IPFS Cert Store","IPFS demo","cert"],
["Zero Trust Model","Zero trust","quantum"],
["AI Fraud Score","ML scoring","quantum"],
["Blockchain Timeline","Chain view","cert"],
["Digital India Safe","Govt guide","cert"],
["Parent Guide","Parents safety","cert"],
["Teacher Toolkit","For schools","cert"],
["Report 1930 Guide","Report process","upi"],
["Matrimonial Scam","Profile check","upi"],
["Instagram Blackmail","Sextortion","upi"],
["Loan Moratorium","RBI fake call","upi"],
["Fastag Toll Fraud","Toll scam","upi"],
["Fake Invoice","GST invoice","upi"],
["Credit Card Skim","Skimmer","upi"],
["Aadhaar Update Scam","Update fraud","upi"],
["PAN Fraud","PAN misuse","upi"],
["Cyber Safe Kids","Kids safety","cert"],
["AKTU Degree Verify","University","cert"]
];

function renderLabs(){
const grid = document.getElementById('grid');
grid.innerHTML = "";
labsList.forEach((lab, i)=>{
const div = document.createElement('div');
div.style.cssText = "background:#141e50;border:1px solid rgba(99,102,241,0.2);border-radius:12px;padding:12px;cursor:pointer";
div.innerHTML = `<div style="font-size:10px;color:#facc15">LAB ${String(i+1).padStart(2,'0')} | ${lab[2].toUpperCase()}</div><div style="font-weight:bold;font-size:14px;margin-top:4px;color:white">${lab[0]}</div><div style="font-size:11px;color:#a5b4fc;margin-top:2px">${lab[1]}</div><div style="margin-top:8px;background:rgba(34,197,94,0.2);color:#4ade80;display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px">Click to Open →</div>`;
div.onclick = function(){ openLab(lab[0], lab[1], lab[2]); };
grid.appendChild(div);
});
}

function openLab(name, desc, type){
currentLab = name;
currentType = type;
document.getElementById('pTitle').innerText = name;
document.getElementById('pDesc').innerText = desc + " | Type: " + type;
document.getElementById('userInput').value = "";
document.getElementById('resultBox').style.display = "none";
document.getElementById('popup').style.display = "flex";
tab(type);
}

function closePop(){
document.getElementById('popup').style.display = "none";
}

function tab(t){
currentType = t;
document.getElementById('b-upi').style.background = t==='upi'?'#22c55e':'#1e1b4b';
document.getElementById('b-qr').style.background = t==='qr'?'#22c55e':'#1e1b4b';
document.getElementById('b-cert').style.background = t==='cert'?'#06b6d4':'#1e1b4b';
document.getElementById('b-quantum').style.background = t==='quantum'?'#eab308':'rgba(234,179,8,0.2)';
}

function doCheck(){
let val = document.getElementById('userInput').value;
if(!val) val = "demo123";
let box = document.getElementById('resultBox');
box.style.display = "block";
if(currentType==='quantum'){
box.innerHTML = `Input: <b>${val}</b><br><br>→ RSA-2048: <span style="color:#f87171">VULNERABLE ❌ Breakable in 8h by Quantum</span><br>→ Kyber-768: <span style="color:#4ade80">SAFE ✅ 0.001s</span><br>→ Dilithium-3: <span style="color:#4ade80">VERIFIED ✅</span><br><br><b style="color:#facc15">Q-Day Ready: Post-Quantum Protected</b>`;
}else if(currentType==='cert'){
let hash = "0x" + val.split('').reduce((a,c)=>a+c.charCodeAt(0),0).toString(16) + "a1b2c3d4";
box.innerHTML = `Cert: <b>${val}</b><br><br>Hash: <span style="color:#4ade80;word-break:break-all">${hash}</span><br><br><span style="color:#4ade80">✅ On-Chain Verified | Authentic | UPMSP / CBSE</span>`;
}else if(currentType==='qr'){
box.innerHTML = `QR: <b>${val}</b><br><br>⚠️ <span style="color:#fb923c">Phishing Risk Detected - This QR leads to fake site</span><br>✅ Action: Do NOT Scan | Report`;
}else{
box.innerHTML = `UPI: <b>${val}</b><br><br>⚠️ <span style="color:#f87171">Fake ${currentLab} Pattern Detected</span><br>✅ Action: Block + Report to 1930<br><br>Safe: Never share OTP/PIN`;
}
}

renderLabs();
</script>
</body>
</html>
